<template>

    <div class="main-container">

        <!-- =====================================================
             PAGE HEADER
             ===================================================== -->

        <div class="page-header">

            <div class="header-icon">

                <lightning-icon
                    icon-name="standard:location"
                    alternative-text="Project"
                    size="medium">
                </lightning-icon>

            </div>

            <div>

                <h1>Project Explorer</h1>

                <p>
                    Select a project to view project and tower details
                </p>

            </div>

        </div>


        <!-- =====================================================
             PROJECT SELECTOR
             ===================================================== -->

        <div class="selector-card">

            <div class="section-title">

                <lightning-icon
                    icon-name="standard:product"
                    alternative-text="Project"
                    size="small">
                </lightning-icon>

                <span>Select Project</span>

            </div>


            <div class="project-selector-row">

                <!-- PROJECT PICKLIST -->

                <div class="project-picker">

                    <lightning-combobox
                        name="project"
                        label="Project"
                        value={selectedProjectId}
                        placeholder="Select a project..."
                        options={projectOptions}
                        onchange={handleProjectChange}>
                    </lightning-combobox>

                </div>


                <!-- VIEW AMENITIES BUTTON -->

                <template if:true={project}>

                    <div class="amenities-button-container">

                        <lightning-button
                            variant="brand-outline"
                            label={amenitiesButtonLabel}
                            icon-name={amenitiesIcon}
                            icon-position="left"
                            onclick={toggleAmenities}>
                        </lightning-button>

                    </div>

                </template>

            </div>

        </div>


        <!-- =====================================================
             LOADING SPINNER
             ===================================================== -->

        <template if:true={isLoading}>

            <div class="loading-container">

                <lightning-spinner
                    alternative-text="Loading project details"
                    size="medium">
                </lightning-spinner>

            </div>

        </template>


        <!-- =====================================================
             PROJECT DETAILS
             ===================================================== -->

        <template if:true={project}>

            <!-- =================================================
                 PROJECT IMAGE
                 ================================================= -->

            <template if:true={projectImageUrl}>

                <div class="project-image-card">

                    <img
                        src={projectImageUrl}
                        alt={project.Name}
                        class="project-image"
                    />

                    <!-- IMAGE OVERLAY -->

                    <div class="image-overlay">

                        <div class="image-project-name">
                            {project.Name}
                        </div>

                        <template if:true={project.Project_Code__c}>

                            <div class="image-project-code">
                                {project.Project_Code__c}
                            </div>

                        </template>

                    </div>

                </div>

            </template>




            <div class="project-section">

                <div class="section-heading">

                    <div>

                        <h2>
                            {project.Name}
                        </h2>

                        <template if:true={project.Project_Code__c}>

                            <span class="project-code">
                                Code: {project.Project_Code__c}
                            </span>

                        </template>

                    </div>


                    <!-- PROJECT STATUS -->

                    <template if:true={project.Project_Status__c}>

                        <span class="status-badge">
                            {project.Project_Status__c}
                        </span>

                    </template>

                </div>


                <!-- =================================================
                     KEY PROJECT METRICS
                     ================================================= -->

                <div class="metrics-grid">


                    <!-- RATE PER SQ FT -->

                    <div class="metric-card">

                        <div class="metric-icon">

                            <lightning-icon
                                icon-name="utility:currency"
                                alternative-text="Rate"
                                size="small">
                            </lightning-icon>

                        </div>

                        <div>

                            <span class="metric-label">
                                Rate / Sq. Ft.
                            </span>

                            <strong>
                                {formattedRate}
                            </strong>

                        </div>

                    </div>


                    <!-- TOTAL TOWERS -->

                    <div class="metric-card">

                        <div class="metric-icon">

                            <lightning-icon
                                icon-name="utility:home"
                                alternative-text="Towers"
                                size="small">
                            </lightning-icon>

                        </div>

                        <div>

                            <span class="metric-label">
                                Total Towers
                            </span>

                            <strong>
                                {project.Total_Towers__c}
                            </strong>

                        </div>

                    </div>


                    <!-- EXPECTED COMPLETION -->

                    <div class="metric-card">

                        <div class="metric-icon">

                            <lightning-icon
                                icon-name="utility:date_input"
                                alternative-text="Completion"
                                size="small">
                            </lightning-icon>

                        </div>

                        <div>

                            <span class="metric-label">
                                Completion
                            </span>

                            <strong>
                                {formattedCompletionDate}
                            </strong>

                        </div>

                    </div>


                    <!-- LOCATION -->

                    <div class="metric-card">

                        <div class="metric-icon">

                            <lightning-icon
                                icon-name="utility:location"
                                alternative-text="Location"
                                size="small">
                            </lightning-icon>

                        </div>

                        <div>

                            <span class="metric-label">
                                Location
                            </span>

                           <strong>{formattedLocation}</strong>

                        </div>

                    </div>

                </div>


                <!-- =================================================
                     PROJECT INFORMATION
                     ================================================= -->

                <div class="details-card">

                    <!-- CARD HEADER -->

                    <div class="card-heading">

                        <lightning-icon
                            icon-name="utility:info"
                            alternative-text="Project Information"
                            size="small">
                        </lightning-icon>

                        <h3>
                            Project Information
                        </h3>

                    </div>


                    <!-- DETAILS GRID -->

                    <div class="details-grid">


                        <!-- PROJECT CODE -->

                        <div class="detail-item">

                            <span>
                                Project Code
                            </span>

                            <strong>
                                {project.Project_Code__c}
                            </strong>

                        </div>


                        <!-- LOCATION -->

                        <div class="detail-item">

                            <span>
                                Location
                            </span>

                            <strong>{formattedLocation}</strong>

                        </div>


                        <!-- PROJECT TYPE -->

                        <div class="detail-item">

                            <span>
                                Project Type
                            </span>

                            <strong>
                                {project.Project_Type__c}
                            </strong>

                        </div>


                        <!-- PROJECT STATUS -->

                        <div class="detail-item">

                            <span>
                                Project Status
                            </span>

                            <strong>
                                {project.Project_Status__c}
                            </strong>

                        </div>


                        <!-- NUMBER OF TOWERS -->

                        <div class="detail-item">

                            <span>
                                Number of Towers
                            </span>

                            <strong>
                                {project.No_of_Towers__c}
                            </strong>

                        </div>


                        <!-- TOTAL TOWERS -->

                        <div class="detail-item">

                            <span>
                                Total Towers
                            </span>

                            <strong>
                                {project.Total_Towers__c}
                            </strong>

                        </div>


                        <!-- RATE -->

                        <div class="detail-item">

                            <span>
                                Rate per Sq. Ft.
                            </span>

                            <strong>
                                {formattedRate}
                            </strong>

                        </div>


                        <!-- ANNOUNCEMENT DATE -->

                        <div class="detail-item">

                            <span>
                                Announcement Date
                            </span>

                            <strong>
                                {formattedAnnouncementDate}
                            </strong>

                        </div>


                        <!-- LAUNCH DATE -->

                        <div class="detail-item">

                            <span>
                                Launch Date
                            </span>

                            <strong>
                                {formattedLaunchDate}
                            </strong>

                        </div>


                        <!-- CONSTRUCTION START -->

                        <div class="detail-item">

                            <span>
                                Construction Start
                            </span>

                            <strong>
                                {formattedConstructionStartDate}
                            </strong>

                        </div>


                        <!-- EXPECTED COMPLETION -->

                        <div class="detail-item">

                            <span>
                                Expected Completion
                            </span>

                            <strong>
                                {formattedCompletionDate}
                            </strong>

                        </div>


                        <!-- RERA REGISTERED -->

                        <div class="detail-item">

                            <span>
                                RERA Registered
                            </span>

                            <template
                                if:true={project.RERA_Registered__c}>

                                <span class="rera-yes">
                                    ✓ Yes
                                </span>

                            </template>

                            <template
                                if:false={project.RERA_Registered__c}>

                                <span class="rera-no">
                                    ✕ No
                                </span>

                            </template>

                        </div>


                        <!-- RERA NUMBER -->

                        <template
                            if:true={project.RERA_Registration_Number__c}>

                            <div class="detail-item">

                                <span>
                                    RERA Registration No.
                                </span>

                                <strong>
                                    {project.RERA_Registration_Number__c}
                                </strong>

                            </div>

                        </template>


                        <!-- RERA REGISTRATION DATE -->

                        <template
                            if:true={project.RERA_Registration_Date__c}>

                            <div class="detail-item">

                                <span>
                                    RERA Registration Date
                                </span>

                                <strong>
                                    {formattedReraRegistrationDate}
                                </strong>

                            </div>

                        </template>


                        <!-- RERA EXPIRY DATE -->

                        <template
                            if:true={project.RERA_Expiry_Date__c}>

                            <div class="detail-item">

                                <span>
                                    RERA Expiry Date
                                </span>

                                <strong>
                                    {formattedReraExpiryDate}
                                </strong>

                            </div>

                        </template>


                        <!-- PROJECT WEBSITE -->

                        <template
                            if:true={project.Project_Website__c}>

                            <div class="detail-item website-item">

                                <span>
                                    Project Website
                                </span>

                                <a
                                    href={project.Project_Website__c}
                                    target="_blank"
                                    rel="noopener noreferrer">

                                    Visit Website

                                    <lightning-icon
                                        icon-name="utility:new_window"
                                        alternative-text="Open website"
                                        size="xx-small">
                                    </lightning-icon>

                                </a>

                            </div>

                        </template>


                    </div>

                </div>

            </div>


            <!-- =====================================================
                 TOWER SECTION
                 ===================================================== -->

            <div class="tower-section">


                <!-- TOWER HEADER -->

                <div class="tower-header">

                    <div>

                        <h2>
                            Tower Details
                        </h2>

                        <p>
                            Explore the towers available in this project
                        </p>

                    </div>


                    <!-- TOWER COUNT -->

                    <div class="tower-count">

                        <lightning-icon
                            icon-name="utility:home"
                            alternative-text="Towers"
                            size="small">
                        </lightning-icon>

                        <strong>
                            {towerCount}
                        </strong>

                        <span>
                            Towers
                        </span>

                    </div>

                </div>


                <!-- =================================================
                     NO TOWERS
                     ================================================= -->

                <template if:false={hasTowers}>

                    <div class="empty-state">

                        <lightning-icon
                            icon-name="utility:info"
                            alternative-text="Information"
                            size="medium">
                        </lightning-icon>

                        <h3>
                            No Towers Found
                        </h3>

                        <p>
                            No towers are currently associated
                            with this project.
                        </p>

                    </div>

                </template>


                <!-- =================================================
                     TOWER CARDS
                     ================================================= -->

                <template if:true={hasTowers}>

                    <div class="tower-grid">


                        <template
                            for:each={towers}
                            for:item="tower">


                            <div
                                class="tower-card"
                                key={tower.Id}
                                data-tower-id={tower.Id}
                                onclick={handleTowerClick}>

                                <!-- =================================
                                     TOWER HEADER
                                     ================================= -->

                                <div class="tower-card-header">


                                    <!-- BUILDING ICON -->

                                    <div class="tower-building-icon">

                                        <lightning-icon
                                            icon-name="utility:home"
                                            alternative-text="Tower"
                                            size="medium">
                                        </lightning-icon>

                                    </div>


                                    <!-- TOWER NAME -->

                                    <div class="tower-title">

                                        <h3>
                                            {tower.Name}
                                        </h3>


                                        <template
                                            if:true={tower.Tower_Code__c}>

                                            <span>
                                                {tower.Tower_Code__c}
                                            </span>

                                        </template>

                                    </div>


                                    <!-- CONSTRUCTION STATUS -->

                                    <template
                                        if:true={tower.Construction_Status__c}>

                                        <span
                                            class="construction-badge">

                                            {tower.Construction_Status__c}

                                        </span>

                                    </template>


                                </div>


                                <!-- =================================
                                     TOWER BODY
                                     ================================= -->

                                <div class="tower-body">


                                    <!-- TOTAL FLOORS -->

                                    <div class="tower-info">

                                        <div class="tower-info-icon">

                                            <lightning-icon
                                                icon-name="utility:layers"
                                                alternative-text="Floors"
                                                size="small">
                                            </lightning-icon>

                                        </div>


                                        <div>

                                            <span>
                                                Floors
                                            </span>

                                            <strong>
                                                {tower.Total_Floors__c}
                                            </strong>

                                        </div>

                                    </div>


                                    <!-- FLATS PER FLOOR -->

                                    <div class="tower-info">

                                        <div class="tower-info-icon">

                                            <lightning-icon
                                                icon-name="utility:home"
                                                alternative-text="Flats"
                                                size="small">
                                            </lightning-icon>

                                        </div>


                                        <div>

                                            <span>
                                                Flats / Floor
                                            </span>

                                            <strong>
                                                {tower.No_of_Flats_per_Floor__c}
                                            </strong>

                                        </div>

                                    </div>


                                    <!-- TOTAL FLATS -->

                                    <div class="tower-info">

                                        <div class="tower-info-icon">

                                            <lightning-icon
                                                icon-name="utility:home"
                                                alternative-text="Total Flats"
                                                size="small">
                                            </lightning-icon>

                                        </div>


                                        <div>

                                            <span>
                                                Total Flats
                                            </span>

                                            <strong>
                                                {tower.Total_Flats__c}
                                            </strong>

                                        </div>

                                    </div>


                                    <!-- POSSESSION DATE -->

                                    <div class="tower-info">

                                        <div class="tower-info-icon">

                                            <lightning-icon
                                                icon-name="utility:date_input"
                                                alternative-text="Possession"
                                                size="small">
                                            </lightning-icon>

                                        </div>


                                        <div>

                                            <span>
                                                Possession
                                            </span>

                                            <strong>
                                                {tower.formattedPossessionDate}
                                            </strong>

                                        </div>

                                    </div>


                                </div>


                                <!-- =================================
                                     TOWER FOOTER
                                     ================================= -->

                                <div class="tower-footer">

                                    <span>
                                        Tower Code
                                    </span>

                                    <strong>
                                        {tower.Tower_Code__c}
                                    </strong>

                                </div>


                            </div>


                        </template>

                    </div>

                </template>


            </div>


        </template>


        <!-- =====================================================
             INITIAL STATE
             ===================================================== -->

        <template if:false={project}>

            <template if:false={isLoading}>

                <div class="initial-state">


                    <div class="initial-icon">

                        <lightning-icon
                            icon-name="standard:location"
                            alternative-text="Project"
                            size="large">
                        </lightning-icon>

                    </div>


                    <h2>
                        Select a Project
                    </h2>


                    <p>
                        Choose a project from the dropdown above
                        to view project and tower information.
                    </p>


                </div>

            </template>

        </template>


    </div>
    <!-- =====================================================
     AMENITIES MODAL
     ===================================================== -->

<template if:true={showAmenities}>

    <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="amenities-modal-heading"
        class="slds-modal slds-fade-in-open">

        <div class="slds-modal__container amenities-modal">

            <!-- MODAL HEADER -->

            <header class="slds-modal__header amenities-modal-header">

                <div class="amenities-modal-title">

                    <div class="amenities-modal-icon">

                        <lightning-icon
                            icon-name="utility:apps"
                            alternative-text="Amenities"
                            size="small">
                        </lightning-icon>

                    </div>

                    <div>

                        <h2
                            id="amenities-modal-heading"
                            class="slds-text-heading_medium">

                            Project Amenities

                        </h2>

                        <template if:true={project}>

                            <p class="amenities-project-name">
                                {project.Name}
                            </p>

                        </template>

                    </div>

                </div>


                <button
                    class="amenities-close-button"
                    title="Close"
                    onclick={toggleAmenities}>

                    <lightning-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        size="small">
                    </lightning-icon>

                </button>

            </header>


            <!-- MODAL BODY -->

            <div class="slds-modal__content slds-p-around_medium amenities-modal-content">

                <template if:true={project.Amenities__c}>

                    <div class="amenities-rich-text">

                        <lightning-formatted-rich-text
                            value={project.Amenities__c}>
                        </lightning-formatted-rich-text>

                    </div>

                </template>


                <!-- NO AMENITIES -->

                <template if:false={project.Amenities__c}>

                    <div class="no-amenities">

                        <lightning-icon
                            icon-name="utility:info"
                            alternative-text="Information"
                            size="medium">
                        </lightning-icon>

                        <h3>
                            No Amenities Available
                        </h3>

                        <p>
                            No amenities have been added
                            for this project.
                        </p>

                    </div>

                </template>

            </div>


            <!-- MODAL FOOTER -->

            <footer class="slds-modal__footer amenities-modal-footer">

                <lightning-button
                    variant="neutral"
                    label="Close"
                    onclick={toggleAmenities}>
                </lightning-button>

            </footer>

        </div>

    </section>


    <!-- BACKDROP -->

    <div
        class="slds-backdrop slds-backdrop_open">
    </div>

</template>

</template>
